<!DOCTYPE html>
<html lang="nb" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Rediger produkt')}"></head>
<body data-color-scheme="auto" data-size="md" data-color="neutral" hx-boost="true">
<th:block th:replace="~{layout :: topbar('produkter')}"></th:block>
<main id="hovedinnhold" class="side" tabindex="-1">
    <nav class="ds-breadcrumbs" aria-label="Du er her:">
        <a class="ds-link" th:href="@{/produkter}" aria-label="Tilbake til Produkter">Produkter</a>
        <ol>
            <li><a class="ds-link" th:href="@{/}">Forside</a></li>
            <li><a class="ds-link" th:href="@{/produkter}">Produkter</a></li>
            <li><a class="ds-link" aria-current="page" th:text="${produkt.navn()}">Produkt</a></li>
        </ol>
    </nav>
    <h1 class="ds-heading" data-size="lg" th:text="|Produkt: ${produkt.navn()}|">Produkt</h1>
    <p class="ds-paragraph liten">Kode <strong th:text="${produkt.kode()}">melding</strong>
        (kan ikke endres).</p>

    <form th:action="@{/produkter/{id}(id=${produkt.id()})}" method="post" class="skjema">
        <th:block th:replace="~{layout :: csrf}"></th:block>
        <ds-field class="ds-field">
            <label class="ds-label" for="navn">Navn</label>
            <input class="ds-input" id="navn" name="navn" th:value="${produkt.navn()}" required
                   data-feilmelding="Skriv inn produktnavnet.">
            <p class="ds-validation-message" data-field="validation" hidden></p>
        </ds-field>
        <div class="ds-field">
            <label class="ds-label" for="enhet">Enhet <span class="ds-tag" data-color="info" data-size="sm">Valgfritt</span></label>
            <input class="ds-input" id="enhet" name="enhet" th:value="${produkt.enhet()}">
        </div>
        <fieldset class="ds-fieldset">
            <legend class="ds-label">Kontering <span class="ds-tag" data-color="info" data-size="sm">Valgfritt</span></legend>
            <p data-field="description">La stå tomt til Økonomi svarer (OQ-2). Manglende kontering blokkerer fakturering.</p>
            <div class="kort-rad">
                <div class="ds-field">
                    <label class="ds-label" for="artikkelId">Artikkel-id</label>
                    <input class="ds-input" id="artikkelId" name="artikkelId" type="number"
                           th:value="${produkt.artikkelId()}">
                </div>
                <div class="ds-field">
                    <label class="ds-label" for="konto">Konto</label>
                    <input class="ds-input" id="konto" name="konto" th:value="${produkt.konto()}">
                </div>
            </div>
            <div class="kort-rad">
                <div class="ds-field">
                    <label class="ds-label" for="dim1" th:text="${dimensjoner.etikett(1)}">Dim 1</label>
                    <input class="ds-input" id="dim1" name="dim1" th:value="${produkt.dim1()}">
                </div>
                <div class="ds-field">
                    <label class="ds-label" for="dim2" th:text="${dimensjoner.etikett(2)}">Dim 2</label>
                    <input class="ds-input" id="dim2" name="dim2" th:value="${produkt.dim2()}">
                </div>
                <div class="ds-field">
                    <label class="ds-label" for="dim4" th:text="${dimensjoner.etikett(4)}">Dim 4</label>
                    <input class="ds-input" id="dim4" name="dim4" th:value="${produkt.dim4()}">
                </div>
            </div>
        </fieldset>
        <ds-field class="ds-field">
            <input class="ds-input" type="checkbox" id="aktiv" name="aktiv" value="true" th:checked="${produkt.aktiv()}">
            <label class="ds-label" for="aktiv">Aktiv</label>
        </ds-field>
        <div class="rad">
            <button class="ds-button" data-color="accent" type="submit">Lagre</button>
            <a class="ds-button" data-variant="tertiary" th:href="@{/produkter}">Avbryt</a>
        </div>
    </form>
</main>
</body>
</html>
