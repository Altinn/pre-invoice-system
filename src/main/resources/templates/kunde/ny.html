<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ny kunde')}"></head>
<body data-color-scheme="light" data-size="md" data-color="neutral" hx-boost="true">
<header th:replace="~{layout :: topbar}"></header>
<main class="side">
    <a class="ds-link" th:href="@{/kunder}">← Kunder</a>
    <h1 class="ds-heading" data-size="lg">Ny kunde</h1>

    <form th:action="@{/kunder}" method="post" style="display:grid; gap:1rem; max-width:32rem;">
        <th:block th:replace="~{layout :: csrf}"></th:block>
        <div class="ds-field">
            <label class="ds-label" for="organisasjonsnummer">Organisasjonsnummer (9 siffer)</label>
            <input class="ds-input" id="organisasjonsnummer" name="organisasjonsnummer"
                   pattern="[0-9]{9}" inputmode="numeric" required>
        </div>
        <div class="ds-field">
            <label class="ds-label" for="virksomhetsnavn">Virksomhetsnavn</label>
            <input class="ds-input" id="virksomhetsnavn" name="virksomhetsnavn" required>
        </div>
        <div class="ds-field">
            <label class="ds-label" for="fakturamottakerOrgnr">Fakturamottaker orgnr (valgfritt — avvikende mottaker)</label>
            <input class="ds-input" id="fakturamottakerOrgnr" name="fakturamottakerOrgnr"
                   pattern="[0-9]{9}" inputmode="numeric">
        </div>
        <div class="ds-field">
            <label class="ds-label" for="avtalestatus">Avtalestatus</label>
            <select class="ds-input" id="avtalestatus" name="avtalestatus">
                <option th:each="s : ${avtalestatuser}" th:value="${s}" th:text="${s}">AKTIV</option>
            </select>
        </div>
        <div class="rad">
            <button class="ds-button" data-color="accent" type="submit">Opprett</button>
            <a class="ds-button" data-variant="tertiary" th:href="@{/kunder}">Avbryt</a>
        </div>
    </form>
</main>
</body>
</html>
