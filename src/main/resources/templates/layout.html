<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared layout fragments. Pages set data-color-scheme/data-size/data-color on <body>, pull in
  `layout :: head(...)` for the <head>, insert `layout :: topbar` as the first child of <body>,
  and include `layout :: csrf` inside every POST <form>.
-->
<head th:fragment="head(tittel)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${tittel} — forsystem|">forsystem</title>
    <link rel="stylesheet" th:href="@{/css/digdir-theme.css}">
    <link rel="stylesheet" th:href="@{/css/designsystemet.css}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
    <style>
        body { margin: 0; }
        .side { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
        .topbar { border-bottom: 1px solid var(--ds-color-neutral-border-subtle);
                  background: var(--ds-color-neutral-background-tinted); }
        .topbar-inner { max-width: 64rem; margin: 0 auto; padding: 0.75rem 1rem;
                        display: flex; gap: 1.25rem; align-items: baseline; flex-wrap: wrap; }
        .topbar a { color: var(--ds-color-neutral-text-default); text-decoration: none; }
        .topbar a:hover { text-decoration: underline; }
        .topbar .merke { font-weight: 600; }
        .rad { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; }
        .stikk { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
        .hoyre { text-align: right; }
        table.ds-table { width: 100%; }
        .kort-rad { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    </style>
</head>
<body>
<header th:fragment="topbar" class="topbar">
    <nav class="topbar-inner">
        <a class="merke" th:href="@{/}">forsystem</a>
        <a th:href="@{/produkter}">Produkter</a>
        <a th:href="@{/prisversjoner}">Prisversjoner</a>
        <a th:href="@{/kunder}">Kunder</a>
        <a th:href="@{/bruksdata}">Bruksdata</a>
        <a th:href="@{/kjoringer}">Kjøringer</a>
        <a th:href="@{/hendelseslogg}">Hendelseslogg</a>
    </nav>
</header>

<!-- CSRF hidden field for POST forms (no Spring Security Thymeleaf dialect on the classpath). -->
<th:block th:fragment="csrf">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
</th:block>
</body>
</html>
