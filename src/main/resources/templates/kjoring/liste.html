<!DOCTYPE html>
<html lang="nb" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Kjøringer')}"></head>
<body data-color-scheme="auto" data-size="md" data-color="neutral" hx-boost="true">
<th:block th:replace="~{layout :: topbar('kjoringer')}"></th:block>
<main id="hovedinnhold" class="side" tabindex="-1">
    <h1 class="ds-heading" data-size="lg">Fakturakjøringer</h1>
    <p class="ds-paragraph ingress">Generer fakturagrunnlag for en periode fra bruksdata og den
        aktive prisversjonen. Kjør kontroller, godkjenn og eksporter.</p>

    <h2 class="ds-heading" data-size="xs">Ny kjøring</h2>
    <form th:action="@{/kjoringer}" method="post" class="rad">
        <th:block th:replace="~{layout :: csrf}"></th:block>
        <ds-field class="ds-field">
            <label class="ds-label" for="periode">Periode</label>
            <input class="ds-input" id="periode" name="periode" type="month" required
                   data-feilmelding="Velg perioden (måned og år).">
            <p class="ds-validation-message" data-field="validation" hidden></p>
        </ds-field>
        <button class="ds-button" data-color="accent" type="submit">Generer</button>
    </form>

    <h2 class="ds-heading" data-size="xs">Kjøringer</h2>
    <table class="ds-table" data-size="sm" data-hover>
        <thead>
        <tr><th>Periode</th><th>Status</th><th>Generert av</th><th>Godkjent av</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="k : ${kjoringer}">
            <td class="periode" th:text="${k.periodeLabel()}">januar 2027</td>
            <td>
                <span class="ds-tag"
                      th:data-color="${k.status() == 'GODKJENT' or k.status() == 'EKSPORTERT'} ? 'success' : (${k.status() == 'FORKASTET'} ? 'neutral' : 'warning')"
                      th:text="${k.status()}">GENERERT</span>
            </td>
            <td th:text="${k.generertAv()}">dev</td>
            <td th:text="${k.godkjentAv()} ?: '—'">—</td>
            <td class="hoyre">
                <a class="ds-button" data-variant="tertiary" data-size="sm"
                   th:href="@{/kjoringer/{id}(id=${k.id()})}">Åpne</a>
            </td>
        </tr>
        <tr th:if="${kjoringer.isEmpty()}">
            <td colspan="5" class="tom">Ingen kjøringer ennå. Velg en periode over og trykk Generer.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
