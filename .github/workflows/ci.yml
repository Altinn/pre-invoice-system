name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN needs package write to push the image to GHCR (the default registry).
permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the Docker daemon preinstalled on the GitHub runner.
      - name: mvn verify
        run: ./mvnw -B --no-transfer-progress clean verify

  image:
    name: Build & publish image
    runs-on: ubuntu-latest
    needs: build-test
    # Publish only on pushes to main; PRs build the image but do not push.
    env:
      # Registry is configurable via a repository variable; defaults to GHCR.
      REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image name (lowercased)
        id: img
        run: echo "name=${REGISTRY,,}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}

  # Every green push to main goes to the test environment, with the image this run just pushed and
  # the overlays from the same commit. Prod stays a manual run of publish-syncroot.yml.
  deploy-tt02:
    name: Deploy to tt02
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # setup-flux-acr in publish-syncroot.yml exchanges the job's OIDC token for Azure credentials.
      id-token: write
    uses: ./.github/workflows/publish-syncroot.yml
    with:
      environment: tt02
      image-tag: ${{ github.sha }}
    secrets: inherit
