apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: preinvoicingsystem
      app.kubernetes.io/part-of: preinvoicingsystem
    includeSelectors: true

resources:
  - applicationidentity.yaml
  - vault.yaml
  - external-secrets.yaml
  - database.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - network-policies.yaml
