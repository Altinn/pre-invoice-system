# PostgreSQL Flexible Server + database (dis-pgsql-operator, RFC 0006).
#
# Dedicated layout: one Database on its own DatabaseServer. `storage` is deliberately omitted so
# the operator picks its own defaults — the alternative is guessing a size/performance tier pair
# that Azure may reject, and the volume here is thousands of rows a month.
apiVersion: storage.dis.altinn.cloud/v1alpha1
kind: DatabaseServer
metadata:
  name: preinvoicingsystem
spec:
  # PostgreSQL 16 is what the Flyway migrations and the Testcontainers suite run against
  # (docker-compose.yaml, docs/05). The operator also supports 17; upgrade deliberately.
  version: 16
  # Size/profile of the server. `dev` -> Standard_B1ms burstable; `prod` -> Standard_D4s_v3 with
  # high availability and 30-day backups. Overridden to `prod` in the prod overlay.
  serverType: dev
  auth:
    admin:
      identity:
        identityRef:
          name: preinvoicingsystem-db-admin
  # Entra group `forsystem-db-admin` — the humans who need to see this server in the Azure
  # portal (docs/07 OQ-17). Referenced by object id and not by `identityRef`, because the group
  # is created in Entra by Digdir IT rather than provisioned by dis-identity-operator from this
  # namespace. Only supported on dedicated servers, which is the layout here — `mode` is left
  # at its `Dedicated` default.
  #
  # This is Azure Reader on the Flexible Server and nothing inside the database; the CRD notes a
  # later operator slice will add the PostgreSQL `pg_monitor` role and read-only SELECT. Database
  # access proper is `Database.spec.access` below, which stays limited to the application.
  debugAccess:
    principals:
      - group:
          name: forsystem-db-admin
          principalId: f72e2197-058e-4f95-8137-cdb6161ddcaa
---
apiVersion: storage.dis.altinn.cloud/v1alpha1
kind: Database
metadata:
  name: preinvoicingsystem
spec:
  name: preinvoicingsystem
  server:
    name: preinvoicingsystem
  access:
    principals:
      # Owner, not Writer: Flyway runs on application startup and issues DDL (docs/02), so the
      # app's own identity needs schema ownership.
      - role: Owner
        identityRef:
          name: preinvoicingsystem
  deletionPolicy: Retain
