# OIDC login parameters, synced out of the Key Vault above into a Kubernetes Secret.
#
# All three are held in the vault rather than in git — not because the issuer and client id are
# secret, but because they are TODO(OQ-17) unknowns owned by whoever registers the Entra
# application. Keeping them out of the manifests means no plausible-looking fake tenant GUID ever
# lands in git, and rotating the app registration is a vault change, not a deployment change.
#
# The team must create these three secrets in the vault before the app can start:
#   oidc-client-id      — application (client) id of the preinvoicingsystem Entra app registration
#   oidc-client-secret  — client secret for that registration
#   oidc-issuer-uri     — e.g. https://login.microsoftonline.com/<tenant-id>/v2.0
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preinvoicingsystem-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: preinvoicingsystem-secret-store
    kind: SecretStore
  target:
    name: preinvoicingsystem-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: oidc-client-secret
    - secretKey: issuer-uri
      remoteRef:
        key: oidc-issuer-uri
