apiVersion: apps/v1
kind: Deployment
metadata:
  name: preinvoicingsystem
spec:
  # One replica, `Recreate`: the export archive is a ReadWriteOnce disk, and the monthly billing
  # run is a single-operator workflow with no need for concurrency.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: preinvoicingsystem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preinvoicingsystem
        azure.workload.identity/use: "true"
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        linkerd.io/inject: enabled
        # Entra/Key Vault (443) and PostgreSQL (5432) are TLS end-to-end and terminate outside
        # the mesh, so there is nothing for the proxy to do on those ports.
        config.linkerd.io/skip-outbound-ports: "443,5432"
    spec:
      # Created by the `preinvoicingsystem` ApplicationIdentity, not by this kustomization.
      serviceAccountName: preinvoicingsystem
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # Must match the numeric UID/GID baked into the image. kubelet cannot verify
        # `runAsNonRoot` against an image whose USER is a name, so the Dockerfile pins 10001.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preinvoicingsystem
          image: preinvoicingsystem:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # Without this the JVM sizes its heap from the node, not the container limit.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"

            # --- PostgreSQL -------------------------------------------------------------
            # dis-pgsql-operator publishes this ConfigMap once the Database is ready. The name is
            # derivable at authoring time: <Database.metadata.name>-<identityRef.name>-dis-pgsql.
            # Keys: host, port, dbname, user, sslmode, uri. There is deliberately no password key
            # — the golden path is Entra token auth (see TODO(OQ-16) below).
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: preinvoicingsystem-preinvoicingsystem-dis-pgsql
                  key: host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: preinvoicingsystem-preinvoicingsystem-dis-pgsql
                  key: port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: preinvoicingsystem-preinvoicingsystem-dis-pgsql
                  key: dbname
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: preinvoicingsystem-preinvoicingsystem-dis-pgsql
                  key: user
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: preinvoicingsystem-preinvoicingsystem-dis-pgsql
                  key: sslmode
            # $(VAR) resolves against entries defined earlier in this list.
            - name: DB_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(DB_SSLMODE)
            # TODO(OQ-16): DB_PASSWORD is intentionally absent. The platform's golden path is
            # passwordless — the app fetches an Entra access token and presents it as the
            # password — which application.yaml cannot do today (it reads a static
            # ${DB_PASSWORD}). Until that is decided and implemented, startup fails at
            # authentication, which is the intended loud failure: do not paper over it by
            # putting a password here.

            # --- OIDC login (values live in Key Vault, see external-secrets.yaml) --------
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: preinvoicingsystem-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: preinvoicingsystem-oidc
                  key: client-secret
            - name: OIDC_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: preinvoicingsystem-oidc
                  key: issuer-uri

            # --- Export archive ---------------------------------------------------------
            - name: FORSYSTEM_ARKIV_KATALOG
              value: /app/data/arkiv
          resources:
            # "0.5 vCPU / 1 GB is plenty" per the infrastructure issue. No CPU limit on purpose:
            # CFS throttling hurts JVM startup (Flyway) far more than a burst costs the node.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          # Flyway migrates before the app reports live, so startup gets a generous budget
          # (30 x 5s) while liveness stays tight afterwards.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: arkiv
              mountPath: /app/data
            # readOnlyRootFilesystem: Spring buffers multipart uploads (the bruksdata CSV
            # import) to java.io.tmpdir, and the JVM writes hsperfdata there.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: arkiv
          persistentVolumeClaim:
            claimName: preinvoicingsystem-arkiv
        - name: tmp
          emptyDir: {}
