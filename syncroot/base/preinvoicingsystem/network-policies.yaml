# Linkerd authorization: only the Traefik gateway may reach the application port. Without the
# AuthorizationPolicy below, declaring a Server makes the port deny-by-default; with it, the only
# accepted client identity is Traefik's service account.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: preinvoicingsystem-http-server
  labels:
    app.kubernetes.io/name: preinvoicingsystem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: preinvoicingsystem
  port: http
  proxyProtocol: HTTP/2
---
apiVersion: policy.linkerd.io/v1beta2
kind: HTTPRoute
metadata:
  name: preinvoicingsystem-http-route
spec:
  parentRefs:
    - name: preinvoicingsystem-http-server
      kind: Server
      group: policy.linkerd.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: preinvoicingsystem-http-auth
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: preinvoicingsystem-http-route
  requiredAuthenticationRefs:
    - name: traefik
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: traefik
spec:
  identities:
    - "altinn-traefik.traefik.serviceaccount.identity.linkerd.cluster.local"
