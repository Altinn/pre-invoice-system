apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-preinvoicingsystem
resources:
  - ../base

images:
  - name: preinvoicingsystem
    # Images are built to GHCR by CI and pulled through the cluster's ACR cache.
    newName: altinncr.azurecr.io/ghcr.io/altinn/pre-invoice-system
    # Rewritten by .github/workflows/publish-syncroot.yml before the artifact is pushed.
    newTag: will-be-replaced

patches:
  - target:
      kind: ApplicationIdentity
    patch: |-
      - op: add
        path: /spec/tags/env
        value: prod
  - target:
      kind: Vault
      name: preinvoicingsystem
    patch: |-
      - op: add
        path: /spec/tags/env
        value: prod
      - op: add
        path: /spec/groupObjectId
        value: 82906e56-15f4-49bd-b215-ac9c1c3d01d9 # DIS AKS Admin Prod PIS
  - target:
      kind: Database
      name: preinvoicingsystem
    patch: |-
      - op: add
        path: /spec/access/principals/-
        value:
          role: Reader
          group:
            name: DIS AKS Admin Prod PIS
            principalId: 82906e56-15f4-49bd-b215-ac9c1c3d01d9
  - target:
      kind: HTTPRoute
      name: preinvoicingsystem
      group: gateway.networking.k8s.io
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          # The internal dis-core name. The public name, preinvoicingsystem.prod.dis.altinn.cloud,
          # lives in dis-edge (edge-syncroot/prod), which rewrites the Host header to this one, so
          # change the two together.
          - preinvoicingsystem.prod.dis-core.altinn.cloud
  - target:
      kind: DatabaseServer
      name: preinvoicingsystem
    patch: |-
      # Standard_D4s_v3 / General Purpose, with high availability and 30-day backup retention
      # applied by the operator's prod defaults.
      - op: replace
        path: /spec/serverType
        value: prod
      - op: add
        path: /spec/debugAccess
        value:
          principals:
            - group:
                name: DIS AKS Admin Prod PIS
                principalId: 82906e56-15f4-49bd-b215-ac9c1c3d01d9
