# Public ingress through the dis-edge Envoy gateway, proxied to the application's dis-core route.
#
# The match is the same as the dis-core HTTPRoute (syncroot/base/preinvoicingsystem/httproute.yaml)
# and paths pass through unchanged. The only rewrite is the Host header: the dis-core Traefik route
# only answers to its own dis-core hostname. Both hostnames are set per overlay.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: preinvoicingsystem
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: dis
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: will-be-patched
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: preinvoicingsystem
          port: 443
